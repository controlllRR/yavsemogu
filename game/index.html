<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Я всё могу! — Настольная игра</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css?v=7" />
</head>
<body>
  <div class="app" id="app">
    <!-- SETUP (скрыт по умолчанию — сразу игра) -->
    <section class="screen setup hidden" id="setupScreen">
      <a class="back-home" href="../index.html">← На сайт</a>
      <div class="setup-card">
        <p class="eyebrow">Игра по карте Смоленска</p>
        <h1>Я всё могу!</h1>
        <p class="lead">Кидай кубики, считай ответ и ходи фишкой по клеткам.</p>

        <div class="field">
          <span class="label">Сколько игроков?</span>
          <div class="chips" id="playerCount" role="group" aria-label="Число игроков">
            <button type="button" class="chip active" data-value="1">1</button>
            <button type="button" class="chip" data-value="2">2</button>
            <button type="button" class="chip" data-value="3">3</button>
            <button type="button" class="chip" data-value="4">4</button>
          </div>
        </div>

        <div class="field" id="namesField">
          <span class="label">Имена игроков</span>
          <div class="names" id="namesList"></div>
        </div>

        <div class="field">
          <span class="label">Сколько кубиков?</span>
          <div class="chips" id="diceCount" role="group">
            <button type="button" class="chip" data-value="1">1 кубик</button>
            <button type="button" class="chip active" data-value="2">2 кубика</button>
          </div>
        </div>

        <div class="field">
          <span class="label">Какие кубики? (уровень)</span>
          <div class="levels" id="diceMode">
            <button type="button" class="level" data-value="dots">
              <strong>Только точки</strong>
              <span>Считаем точки на кубиках</span>
            </button>
            <button type="button" class="level" data-value="digits">
              <strong>Только цифры</strong>
              <span>Складываем написанные числа</span>
            </button>
            <button type="button" class="level active" data-value="mixed">
              <strong>Цифра + точки</strong>
              <span>Сначала цифра, потом точки — считаем вместе</span>
            </button>
          </div>
        </div>

        <div class="field">
          <span class="label">Как ходить фишкой?</span>
          <div class="levels" id="moveMode">
            <button type="button" class="level active" data-value="buttons">
              <strong>Кнопка «Дальше»</strong>
              <span>Удобно малышам: жми стрелку внизу — шаг за шагом</span>
            </button>
            <button type="button" class="level" data-value="drag">
              <strong>Перетаскивать</strong>
              <span>Как в настоящей настольной: тащи фишку мышкой</span>
            </button>
          </div>
        </div>

        <div class="field check">
          <label>
            <input type="checkbox" id="specialCells" checked />
            Особые клетки: зелёные — +2 вперёд, фиолетовые — −2 назад (сами прыгают)
          </label>
        </div>

        <button type="button" class="btn-start" id="startBtn">Начать игру!</button>
      </div>
    </section>

    <!-- PLAY -->
    <section class="screen play" id="playScreen">
      <header class="play-bar">
        <a class="back-home" href="../index.html">← На сайт</a>
        <div class="play-bar-turn" id="turnBox">
          <span class="turn-swatch" id="turnSwatch" aria-hidden="true"></span>
          <strong class="turn-name" id="turnName">—</strong>
          <span class="turn-pos" id="turnPos">старт</span>
          <ul class="roster" id="roster"></ul>
        </div>
        <button type="button" class="btn-ghost" id="settingsBtn">⚙</button>
        <button type="button" class="btn-ghost" id="restartBtn">Заново</button>
      </header>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="Игровое поле">
          <img class="board-img" src="../images/board-map.webp?v=2" alt="Карта игры Я всё могу" width="1024" height="723" draggable="false" />
          <div class="special-glow hidden" id="specialGlow" aria-hidden="true"></div>
          <div class="cell-hint hidden" id="cellHint" aria-hidden="true"></div>
          <div class="fx-burst hidden" id="fxBurst" aria-hidden="true"></div>
          <div class="tokens" id="tokens"></div>
        </div>
      </div>

      <aside class="panel" id="panel">
        <div class="dice-stage" id="diceStage">
          <div class="dice-row" id="diceRow"></div>
          <button type="button" class="btn-roll" id="rollBtn">Бросить!</button>
        </div>

        <div class="answer-box hidden" id="answerBox">
          <div class="answer-row">
            <input type="number" id="answerInput" min="1" max="24" inputmode="numeric" placeholder="?" />
            <button type="button" class="btn-check" id="checkBtn">Готово</button>
          </div>
          <p class="hint" id="hintText"></p>
          <div class="numpad" id="numpad" aria-label="Клавиатура чисел"></div>
        </div>

        <div class="move-box hidden" id="moveBox">
          <p class="move-steps" id="moveSteps">Шагов: 0</p>
          <button type="button" class="btn-step" id="stepBtn">Дальше →</button>
          <p class="move-hint" id="moveHint">Жми кнопку — один шаг</p>
        </div>

        <div class="log" id="log" aria-live="polite"></div>
      </aside>
    </section>

    <!-- WIN -->
    <div class="modal hidden" id="winModal" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="confetti" aria-hidden="true"></div>
        <h2 id="winTitle">Победа!</h2>
        <p id="winText">Первый у домика!</p>
        <button type="button" class="btn-start" id="winAgain">Играть ещё раз</button>
      </div>
    </div>
  </div>

  <script src="game.js?v=7" type="module"></script>
</body>
</html>
